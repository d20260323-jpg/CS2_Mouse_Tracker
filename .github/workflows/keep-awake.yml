name: Keep Streamlit App Awake

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Visit and wake the app
        run: |
          python - <<'EOF'
          from playwright.sync_api import sync_playwright
          import time

          URL = "https://cs2mousetracker-dd6zri2zn7hatssysq28q5.streamlit.app/"

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(URL, wait_until="networkidle", timeout=60000)

              # 如果是休眠页,会有一个唤醒按钮,尝试点击
              try:
                  btn = page.get_by_text("get this app back up", exact=False)
                  if btn.count() > 0:
                      btn.first.click()
                      print("检测到休眠页,已点击唤醒按钮,等待启动...")
                      time.sleep(30)
                  else:
                      print("应用已是醒着的状态 ✅")
              except Exception as e:
                  print(f"未找到唤醒按钮,可能应用本来就是醒着的: {e}")

              browser.close()
          EOF
