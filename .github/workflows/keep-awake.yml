name: Keep Streamlit App Awake

on:
  schedule:
    # 每隔 6 小时跑一次(UTC 时间),防止超过 12 小时无访问导致休眠
    - cron: '0 */6 * * *'
  workflow_dispatch:  # 允许手动触发,方便测试

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app
        run: |
          curl -sSL "https://你的应用名.streamlit.app" -o /dev/null -w "HTTP Status: %{http_code}\n"
